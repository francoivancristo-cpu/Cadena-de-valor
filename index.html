<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Documento — Visor</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0f0f11; /* mismo tono oscuro que el visor */
    }
    .wrap {
      position: fixed;
      inset: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .fallback {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      font: 14px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #c9c9c9;
      text-align: center;
      opacity: .8;
    }
    .fallback a { color: #e6e6e6; }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      src="https://indd.adobe.com/view/ae1c76e5-e379-4c44-807d-cb75c454ddd5?fullscreen"
      allowfullscreen
      style="width:100vw; height:100vh; border:none; background:#fff;
      referrerpolicy="no-referrer-when-downgrade"
      loading="eager"
      title="Cadena de Valor ENAIRE">
    </iframe>

  </div>
</body>
</html>
