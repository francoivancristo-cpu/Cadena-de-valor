<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Documento — Visor</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0f0f11; /* mismo tono oscuro que el visor */
    }
    .wrap {
      position: fixed;
      inset: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .fallback {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      font: 14px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #c9c9c9;
      text-align: center;
      opacity: .8;
    }
    .fallback a { color: #e6e6e6; }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      src="YOUR_ADOBE_PUBLISH_URL"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      loading="eager"
      title="Documento incrustado">
    </iframe>
    <p class="fallback">
      Si no carga, abrilo directamente: 
      <a href="YOUR_ADOBE_PUBLISH_URL" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
    </p>
  </div>
</body>
</html>
